<style>

<style>

<label>主題<select id="theme"><option value="animals">小動物</option><option value="funny">梗圖</option><option value="food">美食誘惑</option><option value="landscape">世界風景</option><option value="toys">童年回憶</option><option value="illustration">繽紛插畫</option><option value="challenge">地獄挑戰</option></select></label>
<label>難度<select id="difficulty"><option value="3">3 × 3</option><option value="4">4 × 4</option></select></label>
<label>圖塊外形<select id="shape"><option value="square">方形</option><option value="classic">經典拼圖</option></select></label>
<button class="primary" id="newGame">新遊戲</button>
<button id="restart">重新開始</button>
<button id="previewButton" aria-expanded="false">預覽完整圖片</button>
</div>
<div class="stats"><span class="stat">✦ 步數 <strong id="moves">0</strong></span><span class="stat">◷ 時間 <strong id="time">00:00</strong></span></div>
<div class="progress-wrap"><span>拼圖進度</span><div class="progress-track" aria-hidden="true"><div id="progressFill" class="progress-fill"></div></div><span id="progress"></span></div>
<svg width="0" height="0" aria-hidden="true" style="position:absolute"><defs id="puzzleClips"></defs></svg>
<div class="layout"><div id="board" class="board" aria-label="拼圖區"></div><aside class="side"><p class="side-title">✦ 拼圖小幫手</p><img id="preview" class="preview hidden" alt="本局完整圖片"><div id="notice" class="notice" role="status" aria-live="polite"></div><div id="source" class="source"></div><section class="rival" aria-label="模擬對手"><div class="rival-head"><span>同桌對手</span><button id="rivalToggle" type="button" aria-pressed="true">吐槽：開</button></div><div id="rivalAvatar" class="rival-avatar" role="img" aria-label="同桌對手肖像"></div><p id="rivalSpeech" class="rival-speech" aria-live="polite" tabindex="-1">準備好了嗎？我可不會手下留情！</p></section></aside></div>
</section>
</main>
<script>
'use strict';
const GAME_NAME = '拼到你脫窗';
const RIVAL_LINES = [
  '你怎麼這麼慢，我都快喝完茶了。','這塊拼很久了吧？它都等累了。','哎呀，這一步是聲東擊西嗎？','別急，我有一整天可以等。','看來這張圖比你想的還有個性。',
  '要不要我假裝沒看到剛才那一步？','不錯喔，至少拼圖還在桌上。','你是不是在和圖塊培養感情？','這速度，蝸牛都想替你加油了。','那塊又搬家啦？還沒找到歸宿嗎？',
  '我剛剛打了個盹，你還在想這一塊呀？','別緊張，我只是在旁邊默默計時。','這是拼圖，還是圖塊環島旅行？','你剛剛那一步，很有實驗精神！','我猜你有一套神祕的拼圖策略。',
  '這塊都來回三次了，是捨不得離開嗎？','慢工出細活……你一定做得特別細。','我先數數星星，等你找到下一塊。','你是在幫圖塊找室友嗎？','看你的表情，這題似乎不簡單喔。',
  '那塊是不是偷偷換位置了？','我看得出來，你正在認真思考人生。','別擔心，拼圖沒有下班時間。','這張圖原來還可以這樣排列呀！','你在測試我的耐心嗎？很成功喔。',
  '差一點點！至於差多少，我就不說了。','這一手出得真妙，連拼圖都愣住了。','你的圖塊好像很喜歡四處散步。','要不要先跟角落的圖塊打聲招呼？','我覺得你離答案越來越近……大概吧。',
  '這速度很適合泡一壺好茶呢。','你是不是故意讓我有機會追上？','看來你和這塊圖有一段故事。','如果猶豫也算步數，你早就破紀錄了。','我剛眨個眼，你還在選同一塊？',
  '這拼法很有創意，就是有點抽象。','我已經開始替圖塊想名字了。','你在找拼圖，還是在找靈感？','別看我，答案不會寫在我臉上。','這塊好像在對你說：再想想。',
  '我差點以為你在幫拼圖重新裝潢。','穩住，你的傳奇操作就快出現了。','你這是在慢慢享受，對吧？','那一步讓我都忍不住重新思考了。','拼圖不會跑，但時間會喔。',
  '你很有耐心，我也正在學習。','這個位置看起來很熟悉，是不是來過？','我準備好了，你什麼時候準備好？','你的下一步，我決定拭目以待。','加油！我還等著看你翻盤呢。',
  '你這叫策略？我還以為是圖塊自己摔的。','照這速度，拼完可以直接慶祝週年了。','你每換一步，答案就離家出走一次。','我以為你在熱身，原來已經開始了？','拼圖看到你的操作，開始懷疑自己的位置。',
  '你不是卡關，你是在這裡定居了吧。','這步真精彩，我差點以為你按錯了。','原來你的戰術是先把自己繞暈。','你離成功只差一步，偏偏每一步都不是。','圖塊都認路了，你還在研究地圖？',
  '你剛才那招，我稱它為原地踏步。','再這樣換下去，圖塊都要申請加班費了。','別急著贏，畢竟目前看來不用擔心。','我都替正確答案感到寂寞了。','你對錯誤的位置還真是情有獨鍾。',
  '你的拼圖技巧，讓隨機排列都顯得有計畫。','我猜下一步……算了，你的思路太神祕。','這麼認真地走錯路，也是一種天分。','你是來解謎的，還是來增加難度的？','你繼續，我正記錄什麼叫做完美的反面教材。'
];
const RIVAL_INTERVAL_MS = [7000, 14000];
const VICTORY_LINES = ['這次算你厲害，下次可沒那麼容易！','你是不是偷偷練習過？老實招來！','哼，這次是圖塊自己走對的吧！','我只是讓你一局，別太得意！','看不出來嘛，手速還挺快的。','這張圖一定偷偷提示你了！','好啦，這局你贏，下一局走著瞧。','我剛剛只是分心喝了口茶！','厲害喔，害我連吐槽都忘了。','你贏了？我要求檢查一下拼圖！','好吧，這次掌聲先借你用一下。','我承認，剛才小看你了那麼一點。','哎呀，原來你真的會拼啊！','這一局給你，下局我要認真了。','你的運氣不錯，實力嘛……也還行！','我剛才的嘲諷是不是反而幫到你了？','別高興太早，下一張我可盯緊了！','算你過關，但我的嘴可沒輸。','太精彩了！不過我絕對不會說第二遍。','你這次贏得漂亮，讓我很難繼續嘴硬耶。'];
document.title = GAME_NAME; document.getElementById('title').textContent = GAME_NAME;
const $ = id => document.getElementById(id);
const board = $('board'), theme = $('theme'), difficulty = $('difficulty');
const categories = {animals:['Category:Kittens'], funny:['Category:Internet memes','Category:Memes and image macros','Category:Lolcats','Category:Image macros with animals'], food:['Category:Food photography'], landscape:['Category:Landscape photography'], toys:['Category:Toys','Category:Close-up photographs of toys'], illustration:["Category:Children's book illustrations"], challenge:['Category:Geometric patterns','Category:Quality images of patterns and textures']};
const recent = {animals:[], funny:[], food:[], landscape:[], toys:[], illustration:[], challenge:[]};
let tiles = [], selected = null, moves = 0, started = 0, timer = null, won = false, imageURL = '', gameId = 0, audio;
let shapeSize = 0;
function makePuzzleShapes(n) {
  shapeSize=n;
  const horizontal=Array.from({length:n-1},()=>Array.from({length:n},()=>Math.random()<.5?1:-1));
  const vertical=Array.from({length:n},()=>Array.from({length:n-1},()=>Math.random()<.5?1:-1));
  const defs=$('puzzleClips'); defs.replaceChildren();
  for(let tile=0;tile<n*n;tile++) {
    const x=tile%n,y=Math.floor(tile/n),edges=[y?-horizontal[y-1][x]:0,x<n-1?vertical[y][x]:0,y<n-1?horizontal[y][x]:0,x?-vertical[y][x-1]:0];
    const corners=[[1,1],[6,1],[6,6],[1,6],[1,1]], points=[];
    for(let side=0;side<4;side++) {
      const [ax,ay]=corners[side],[bx,by]=corners[side+1],dx=bx-ax,dy=by-ay;
      for(const [t,d] of (edges[side]?[[0,0],[.32,0],[.36,.07],[.34,.12],[.38,.17],[.5,.19],[.62,.17],[.66,.12],[.64,.07],[.68,0]]:[[0,0]])) points.push(`${(ax+dx*t+dy*d*edges[side])/7},${(ay+dy*t-dx*d*edges[side])/7}`);
    }
    const clip=document.createElementNS('http://www.w3.org/2000/svg','clipPath'),polygon=document.createElementNS('http://www.w3.org/2000/svg','polygon');
    clip.id=`piece-${tile}`; clip.setAttribute('clipPathUnits','objectBoundingBox'); polygon.setAttribute('points',points.join(' ')); clip.append(polygon); defs.append(clip);
  }
}
let rivalEnabled = true, rivalTimer = null, rivalAlertTimer = null, victoryTimer = null, lastVictoryLine = -1, lastRivalLine = -1, rivalDeck = [];
function stopRival() { clearTimeout(rivalTimer); clearTimeout(rivalAlertTimer); clearTimeout(victoryTimer); rivalTimer = null; }
function rivalSay(line) { const bubble=$('rivalSpeech'), avatar=$('rivalAvatar'); bubble.textContent=line; for(const el of [bubble,avatar]){el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');} if(audio) sound('rival'); }
function scheduleRival() {
  clearTimeout(rivalTimer); rivalTimer = null;
  if (!rivalEnabled || won || !imageURL) return;
  const [min,max] = RIVAL_INTERVAL_MS;
  rivalTimer = setTimeout(() => {
    if (!rivalEnabled || won || !imageURL) return;
    if (!rivalDeck.length) { rivalDeck=shuffle(RIVAL_LINES.map((_,i)=>i)); if (rivalDeck.length>1 && rivalDeck[rivalDeck.length-1]===lastRivalLine) [rivalDeck[0],rivalDeck[rivalDeck.length-1]]=[rivalDeck[rivalDeck.length-1],rivalDeck[0]]; }
    lastRivalLine = rivalDeck.pop(); rivalSay(RIVAL_LINES[lastRivalLine]);
    scheduleRival();
  }, min + Math.random() * (max - min));
}
function sound(kind) {
  try {
    audio ||= new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') audio.resume();
    const notes = {select:[440],swap:[320,400],correct:[520,660],win:[523,659,784,1047],rival:[740,560]}[kind];
    notes.forEach((freq,i) => { const at=audio.currentTime+i*.1, o=audio.createOscillator(), g=audio.createGain(); o.type='sine'; o.frequency.value=freq; g.gain.setValueAtTime(.0001,at); g.gain.exponentialRampToValueAtTime(.09,at+.01); g.gain.exponentialRampToValueAtTime(.0001,at+.16); o.connect(g); g.connect(audio.destination); o.start(at); o.stop(at+.17); });
  } catch (_) {}
}
function shuffle(a) { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function reset() {
  stopRival(); $('rivalAvatar').classList.remove('defeated'); clearInterval(timer); won=false; selected=null; moves=0; started=Date.now(); $('moves').textContent='0'; $('time').textContent='00:00'; board.classList.remove('won'); $('notice').textContent='點選兩塊拼圖來交換位置。'; $('notice').className='notice';
  const count=Number(difficulty.value)**2; do {tiles=shuffle(Array.from({length:count},(_,i)=>i));} while(tiles.every((n,i)=>n===i));
  timer=setInterval(()=>{const s=Math.floor((Date.now()-started)/1000);$('time').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');},1000); $('rivalSpeech').textContent=rivalEnabled?'準備好了嗎？我可不會手下留情！':'對手安靜休息中。'; scheduleRival(); render();
}
function render() {
  const n=Number(difficulty.value); board.style.gridTemplateColumns=`repeat(${n},1fr)`; board.replaceChildren();
  const classic=$('shape').value==='classic'; board.classList.toggle('classic',classic);
  if(classic && shapeSize!==n) makePuzzleShapes(n);
  tiles.forEach((tile,i)=>{const b=document.createElement('button'); b.type='button'; b.className='tile'+(tile===i?' correct':'')+(selected===i?' selected':''); b.style.backgroundImage=`url(${JSON.stringify(imageURL)})`; if(classic){b.style.position='absolute';b.style.width=b.style.height=`${140/n}%`;b.style.left=`${((i%n)-.2)*100/n}%`;b.style.top=`${(Math.floor(i/n)-.2)*100/n}%`;b.style.clipPath=`url(#piece-${tile})`;b.style.backgroundSize=`${n/1.4*100}% ${n/1.4*100}%`;b.style.backgroundPosition=`${((tile%n)-.2)*100/(n-1.4)}% ${(Math.floor(tile/n)-.2)*100/(n-1.4)}%`;b.style.zIndex=selected===i?'2':tile===i?'1':'0';}else{b.style.backgroundSize=`${n*100}% ${n*100}%`; b.style.backgroundPosition=`${(tile%n)*100/(n-1)}% ${Math.floor(tile/n)*100/(n-1)}%`;} b.setAttribute('aria-label',`位置 ${i+1}，拼圖片 ${tile+1}${tile===i?'，已歸位':''}`); b.addEventListener('click',()=>choose(i)); board.append(b);});
  const correct=tiles.filter((x,i)=>x===i).length; $('progress').textContent=`${correct} / ${tiles.length}`; $('progressFill').style.width=`${correct/tiles.length*100}%`;
}
function choose(i) {
  if(won) return;
  if(selected===null){selected=i;sound('select');render();board.children[i].focus();return;}
  if(selected===i){selected=null;render();board.children[i].focus();return;}
  const other=selected, before=[tiles[i]===i,tiles[other]===other]; [tiles[i],tiles[other]]=[tiles[other],tiles[i]]; selected=null; moves++; $('moves').textContent=moves; render(); board.children[i].focus();
  const placed=[i,other].filter((pos,k)=>tiles[pos]===pos&&!before[k]);
  placed.forEach(pos=>board.children[pos].classList.add('flash'));
  if(tiles.every((x,pos)=>x===pos)) { won=true; clearInterval(timer); stopRival(); victoryTimer=setTimeout(()=>{ $('rivalAvatar').classList.add('defeated'); if(rivalEnabled){ let i=Math.floor(Math.random()*(VICTORY_LINES.length-(lastVictoryLine>=0?1:0))); if(lastVictoryLine>=0 && i>=lastVictoryLine) i++; lastVictoryLine=i; rivalSay(VICTORY_LINES[i]); } },1000); board.classList.add('won'); $('notice').className='notice win'; $('notice').textContent=`✦ 太棒了，拼圖完成！共用了 ${moves} 步，花費 ${$('time').textContent}。`; sound('win'); }
  else sound(placed.length?'correct':'swap');
}
function setPreview(show) {
  document.getElementById('preview').classList.toggle('hidden', !show);
  document.getElementById('previewButton').setAttribute('aria-expanded', String(show));
  document.getElementById('previewButton').textContent = show ? '關閉預覽' : '預覽完整圖片';
}
function fallback() {
  const c=document.createElement('canvas'); c.width=c.height=720; const x=c.getContext('2d'), hue=Math.floor(Math.random()*360); const grad=x.createLinearGradient(0,0,720,720); grad.addColorStop(0,`hsl(${hue} 45% 35%)`); grad.addColorStop(1,`hsl(${(hue+100)%360} 55% 65%)`); x.fillStyle=grad;x.fillRect(0,0,720,720);
  for(let i=0;i<25;i++){x.fillStyle=`hsla(${(hue+Math.random()*160)%360} 65% 75% / .55)`;x.beginPath();x.arc(Math.random()*720,Math.random()*720,25+Math.random()*120,0,Math.PI*2);x.fill();} return c.toDataURL();
}
function loadImage(url) {return new Promise((resolve,reject)=>{const img=new Image();img.crossOrigin='anonymous';const timeout=setTimeout(()=>{img.src='';reject(new Error('圖片載入逾時'));},12000);img.onload=()=>{clearTimeout(timeout);resolve(img);};img.onerror=()=>{clearTimeout(timeout);reject(new Error('圖片載入失敗或跨域遭拒'));};img.src=url;});}
async function newGame() {
  const id=++gameId, topic=theme.value; shapeSize=0; imageURL=''; clearInterval(timer); stopRival(); $('rivalAvatar').classList.remove('defeated'); won=true; selected=null; board.replaceChildren(); $('notice').className='notice'; $('notice').textContent='正在尋找圖片…'; $('source').replaceChildren(); setPreview(false); $('previewButton').disabled=true;
  try {
    const results=await Promise.allSettled(categories[topic].map(async category=>{
      const params=new URLSearchParams({action:'query',generator:'categorymembers',gcmtitle:category,gcmtype:'file',gcmlimit:'100',prop:'imageinfo',iiprop:'url|mime',iiurlwidth:'800',format:'json',origin:'*'});
      const response=await fetch('https://commons.wikimedia.org/w/api.php?'+params,{signal:AbortSignal.timeout(12000)}); if(!response.ok) throw new Error('圖源連線失敗'); return response.json();
    }));
    const pages=results.flatMap(r=>r.status==='fulfilled'?Object.values(r.value.query?.pages||{}):[]);
    const candidates=[...new Map(pages.filter(p=>{const info=p.imageinfo?.[0];return info?.thumburl && /^image\/(jpeg|png|webp)$/.test(info.mime);}).map(p=>[p.pageid,p])).values()];
    if(!candidates.length) throw new Error('圖源沒有可用圖片');
    const fresh=candidates.filter(p=>!recent[topic].includes(p.pageid)); const pool=shuffle(fresh.length?fresh:candidates); let picked;
    for(const p of pool.slice(0,8)){try{await loadImage(p.imageinfo[0].thumburl);picked=p;break;}catch(_){}}
    if(!picked) throw new Error('圖片載入失敗'); if(id!==gameId)return;
    imageURL=picked.imageinfo[0].thumburl; recent[topic].push(picked.pageid); if(recent[topic].length>15)recent[topic].shift();
    const link=document.createElement('a');link.href=picked.imageinfo[0].descriptionurl;link.target='_blank';link.rel='noopener noreferrer';link.textContent='圖片來源與授權：Wikimedia Commons';$('source').append(link);
  } catch(error) {if(id!==gameId)return;imageURL=fallback();$('source').textContent='網路圖片載入失敗，使用隨機圖案。';}
  $('preview').src=imageURL; $('previewButton').disabled=false; reset();
}
$('newGame').addEventListener('click',newGame); theme.addEventListener('change',newGame); difficulty.addEventListener('change',()=>{if(imageURL)reset();}); $('restart').addEventListener('click',()=>{if(imageURL)reset();}); document.getElementById('previewButton').addEventListener('click',()=>setPreview(document.getElementById('preview').classList.contains('hidden')));
$('shape').addEventListener('change',()=>{if(imageURL)render();});
$('rivalToggle').addEventListener('click',()=>{rivalEnabled=!rivalEnabled; $('rivalToggle').setAttribute('aria-pressed',String(rivalEnabled)); $('rivalToggle').textContent=rivalEnabled?'吐槽：開':'吐槽：關'; $('rivalSpeech').textContent=rivalEnabled?(won?'等下一局再來較勁！':'我回來盯著你啦！'):'對手安靜休息中。'; if(rivalEnabled) scheduleRival(); else stopRival();});
console.assert(shuffle([0]).length===1 && [0,1,2].every((x,i)=>x===i),'基本拼圖檢查失敗');
newGame();
</script>
